# Publishes the website (the `website` folder) to GitHub Pages whenever it changes.
# One-time setup on GitHub (a workflow isn't allowed to do this itself):
# Settings → Pages → Source: "GitHub Actions". Then run this workflow once from the Actions tab.
# The site then lives at https://erickb2021-lgtm.github.io/HushKey/
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # the site is served from github.io/HushKey/, not from the root of the domain
          NEXT_PUBLIC_BASE_PATH: /HushKey
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
