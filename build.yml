# Builds HushKey for Windows and Mac on GitHub's own computers.
#
# - Publish a Release on the GitHub website (Releases -> Draft a new release):
#   this builds both apps and attaches HushKey-Windows.exe and HushKey-Mac.zip
#   to that release, which is what the README's download buttons point to.
# - Every push to main: builds both apps as a check (Actions tab -> run ->
#   "Artifacts" at the bottom), but doesn't publish anything.
# - You can also start it by hand from the Actions tab ("Run workflow").

name: Build HushKey

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: Mac
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ github.event.release.tag_name || '0.0.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      # ---------------- Windows ----------------
      # Antivirus false alarms mostly hit PyInstaller's shared, pre-built
      # "bootloader" and single-file .exe programs that unpack themselves. So:
      #   1. compile our own bootloader instead of using the shared one
      #   2. build a normal folder app (not --onefile self-extracting)
      #   3. fill in the .exe's name/version details
      #   4. wrap it in a standard Inno Setup installer
      - name: Install PyInstaller (own bootloader)
        if: matrix.label == 'Windows'
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Bootloader compile failed - falling back to the standard one."
            pip install pyinstaller
          }

      - name: Build Windows app
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          python packaging/make_version_info.py $env:APP_VERSION
          pyinstaller --noconfirm --clean --windowed --noupx --name HushKey `
            --version-file packaging/version_info.txt app.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Windows installer
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = $env:APP_VERSION.TrimStart('v','V')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $hash = (Get-FileHash dist\HushKey-Windows.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HushKey-Windows.exe" | Out-File -Encoding ascii dist\HushKey-Windows.exe.sha256.txt

      # ---------------- Mac ----------------
      - name: Build Mac app
        if: matrix.label == 'Mac'
        run: |
          pip install pyinstaller
          VER="${APP_VERSION#v}"
          pyinstaller --noconfirm --clean --windowed --name HushKey \
            --osx-bundle-identifier com.hushkey.app app.py
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" dist/HushKey.app/Contents/Info.plist || true
          codesign --force --deep --sign - dist/HushKey.app
          cd dist
          ditto -c -k --keepParent HushKey.app HushKey-Mac.zip
          shasum -a 256 HushKey-Mac.zip > HushKey-Mac.zip.sha256.txt

      # ---------------- Publish ----------------
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HushKey-${{ matrix.label }}
          path: |
            dist/HushKey-Windows.exe
            dist/HushKey-Mac.zip
            dist/*.sha256.txt
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HushKey-Windows.exe
            dist/HushKey-Mac.zip
            dist/*.sha256.txt
          fail_on_unmatched_files: false
